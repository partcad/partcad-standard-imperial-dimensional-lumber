partcad: ">=0.8.78"  # parametric interfaces
name: //pub/std/imperial/dimensional-lumber
desc: Dimensional lumber and plywood in imperial units

docs:
  intro: |
    The standard (US) sizes of softwood dimensional lumber and plywood, as
    parametric parts.

    A piece of lumber is named by its **nominal** size ("2x4"), which is the
    size of the rough-sawn board before it is dried and planed. What is sold is
    smaller, by the amounts ASME/ALSC PS 20 gives: a nominal 1 in. is 3/4 in.
    actual, 2 to 7 in. lose 1/2 in., and 8 in. and up lose 3/4 in. -- so a 2x4
    is 1-1/2 x 3-1/2 in. and a 2x8 is 1-1/2 x 7-1/4 in. The length is not
    dressed, so an 8 ft. board is 96 in. long. Plywood is named by its nominal
    thickness and is 1/32 in. thinner than that.

    The parameters are the nominal sizes, the geometry is the actual one. Every
    part is modelled in the same frame, so that a piece cut from a longer one is
    in the coordinates of the board it came from:

    * `lumber`: the width along X, the length along Y, the height (the
      thickness of a board lying flat) along Z, with one corner at the origin.
      The long edges are eased, the way milled lumber is.
    * `plywood`: the width along X, the length along Y, the thickness along Z.

    Both implement `cuboid`, the box they fill at their actual size: a port at
    every corner and at the middle of every edge, on each face that meets
    there, named by the face and then where on it (`z1-x0-y0`, `z1-x0`). A
    port's +Z points into the piece, so two pieces are joined by the two ports
    where they touch.

    A store sells particular sizes of these. It says so by declaring each of its
    products as an instance of `lumber` or `plywood` (an `enrich`) with the
    product's own vendor and SKU -- see `//pub/svc/commerce/homedepot` -- and a
    part cut to length from one names that product as its stock.

  usage: |
    ```shell
    pc inspect -p width=4 -p height=2 -p length=96 :lumber
    pc inspect -p thickness=0.75 :plywood
    ```

    From another package, as an instance of the standard size:

    ```yaml
    parts:
      stud:
        type: enrich
        source: //pub/std/imperial/dimensional-lumber:lumber
        with:
          width: 4
          height: 2
          length: 92.625
    ```

interfaces:
  # The box a piece of lumber or a panel fills, with a port at every corner and
  # at the middle of every edge, on each face that meets there. Each port's +Z
  # is the inward normal of its face, so two ports mate where two faces touch.
  #
  # A port is named by its face, then by where on that face it is: 'z1-x0-y0'
  # is on the top face (Z = z), at its corner with the X = 0 and the Y = 0
  # faces, and 'z1-x0' is on the top face, at the middle of its edge with the
  # X = 0 face. At a corner, X and Y run along the two edges into the face; at
  # the middle of an edge, X points into the face and Y runs along the edge.
  # So two corners mate with their faces flush in the same quadrant, a corner
  # mates with the middle of an edge with the two edges in line, and two
  # middles of edges mate with the edges crossed at right angles.
  cuboid:
    desc: A box, with ports at its corners and the middles of its edges
    parameters:
      x:
        type: float
        desc: The size along X, in millimetres
        default: 25.4
      y:
        type: float
        desc: The size along Y, in millimetres
        default: 25.4
      z:
        type: float
        desc: The size along Z, in millimetres
        default: 25.4
    ports:
      x0-y0: [[0, 0, "%z / 2%"], [1, 1, 1], 120]
      x0-y1: [[0, "%y%", "%z / 2%"], [-1, 1, -1], 120]
      x0-z0: [[0, "%y / 2%", 0], [1, 0, 1], 180]
      x0-z1: [[0, "%y / 2%", "%z%"], [0, 1, 0], 90]
      x0-y0-z0: [[0, 0, 0], [1, 1, 1], 120]
      x0-y0-z1: [[0, 0, "%z%"], [0, 1, 0], 90]
      x0-y1-z0: [[0, "%y%", 0], [1, 0, 1], 180]
      x0-y1-z1: [[0, "%y%", "%z%"], [-1, 1, -1], 120]
      x1-y0: [["%x%", 0, "%z / 2%"], [-1, -1, 1], 120]
      x1-y1: [["%x%", "%y%", "%z / 2%"], [1, -1, -1], 120]
      x1-z0: [["%x%", "%y / 2%", 0], [0, -1, 0], 90]
      x1-z1: [["%x%", "%y / 2%", "%z%"], [1, 0, -1], 180]
      x1-y0-z0: [["%x%", 0, 0], [0, -1, 0], 90]
      x1-y0-z1: [["%x%", 0, "%z%"], [-1, -1, 1], 120]
      x1-y1-z0: [["%x%", "%y%", 0], [1, -1, -1], 120]
      x1-y1-z1: [["%x%", "%y%", "%z%"], [1, 0, -1], 180]
      y0-x0: [[0, 0, "%z / 2%"], [-1, 0, 0], 90]
      y0-x1: [["%x%", 0, "%z / 2%"], [0, 1, 1], 180]
      y0-z0: [["%x / 2%", 0, 0], [-1, -1, -1], 120]
      y0-z1: [["%x / 2%", 0, "%z%"], [-1, 1, 1], 120]
      y0-x0-z0: [[0, 0, 0], [-1, -1, -1], 120]
      y0-x0-z1: [[0, 0, "%z%"], [-1, 0, 0], 90]
      y0-x1-z0: [["%x%", 0, 0], [0, 1, 1], 180]
      y0-x1-z1: [["%x%", 0, "%z%"], [-1, 1, 1], 120]
      y1-x0: [[0, "%y%", "%z / 2%"], [1, 0, 0], 90]
      y1-x1: [["%x%", "%y%", "%z / 2%"], [0, 1, -1], 180]
      y1-z0: [["%x / 2%", "%y%", 0], [1, -1, 1], 120]
      y1-z1: [["%x / 2%", "%y%", "%z%"], [1, 1, -1], 120]
      y1-x0-z0: [[0, "%y%", 0], [1, 0, 0], 90]
      y1-x0-z1: [[0, "%y%", "%z%"], [1, 1, -1], 120]
      y1-x1-z0: [["%x%", "%y%", 0], [1, -1, 1], 120]
      y1-x1-z1: [["%x%", "%y%", "%z%"], [0, 1, -1], 180]
      z0-x0: [[0, "%y / 2%", 0], [0, 0, 1], 0]
      z0-x1: [["%x%", "%y / 2%", 0], [0, 0, 1], 180]
      z0-y0: [["%x / 2%", 0, 0], [0, 0, 1], 90]
      z0-y1: [["%x / 2%", "%y%", 0], [0, 0, -1], 90]
      z0-x0-y0: [[0, 0, 0], [0, 0, 1], 0]
      z0-x0-y1: [[0, "%y%", 0], [0, 0, -1], 90]
      z0-x1-y0: [["%x%", 0, 0], [0, 0, 1], 90]
      z0-x1-y1: [["%x%", "%y%", 0], [0, 0, 1], 180]
      z1-x0: [[0, "%y / 2%", "%z%"], [1, 0, 0], 180]
      z1-x1: [["%x%", "%y / 2%", "%z%"], [0, 1, 0], 180]
      z1-y0: [["%x / 2%", 0, "%z%"], [1, 1, 0], 180]
      z1-y1: [["%x / 2%", "%y%", "%z%"], [1, -1, 0], 180]
      z1-x0-y0: [[0, 0, "%z%"], [1, 1, 0], 180]
      z1-x0-y1: [[0, "%y%", "%z%"], [1, 0, 0], 180]
      z1-x1-y0: [["%x%", 0, "%z%"], [0, 1, 0], 180]
      z1-x1-y1: [["%x%", "%y%", "%z%"], [1, -1, 0], 180]

parts:
  lumber:
    type: cadquery
    desc: Softwood dimensional lumber, by its nominal size
    # The box it fills: the actual sizes, so its ports are where the faces
    # are. The long edges are eased, so a corner is where two faces would meet.
    implements:
      "cuboid;x=%(width - 0.25 if width == 1 else width - 0.75 if width >= 8 else width - 0.5) * 25.4%,y=%length * 25.4%,z=%(height - 0.25 if height == 1 else height - 0.75 if height >= 8 else height - 0.5) * 25.4%":
    parameters:
      width:
        type: int
        desc: The nominal width in inches (the "4" of a 2x4), along X
        enum: [1, 2, 3, 4, 5, 6, 8, 10, 12]
        default: 4
      height:
        type: int
        desc: The nominal thickness in inches (the "2" of a 2x4), along Z
        enum: [1, 2, 3, 4, 5, 6, 8, 10, 12]
        default: 2
      length:
        type: float
        desc: The length in inches, along Y. Not dressed, so it is the actual length
        default: 120
      tolerance:
        # 1/16 in.: what a board is sold to, and what a saw cuts one to.
        type: float
        desc: How precisely it is made, in millimetres
        default: 1.6
  plywood:
    type: cadquery
    desc: A plywood panel, by its nominal thickness
    implements:
      "cuboid;x=%width * 25.4%,y=%length * 25.4%,z=%(thickness - 0.03125) * 25.4%":
    parameters:
      width:
        type: float
        desc: The width in inches, along X
        default: 48
      length:
        type: float
        desc: The length in inches, along Y
        default: 48
      thickness:
        type: float
        desc: >
          The nominal thickness in inches, along Z (0.75 for the panel sold as
          "3/4 in." or "23/32 in."). The actual thickness is 1/32 in. less
        default: 0.5
      tolerance:
        # 1/32 in.: what a panel saw cuts a sheet to.
        type: float
        desc: How precisely it is made, in millimetres
        default: 0.8
